name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    # Read-only: building and testing never needs write access. Publishing the
    # release is a separate job (publish-release) scoped to contents: write.
    permissions:
      contents: read

    outputs:
      version: ${{ steps.release_version.outputs.version }}
      tag: ${{ steps.release_version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Calculate automatic release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_version
        uses: actions/github-script@v7
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existing = tags.find(({ name, commit }) =>
              commit.sha === context.sha && /^v\d+\.\d+\.\d+$/.test(name));
            if (existing) {
              const version = existing.name.slice(1);
              core.setOutput('version', version);
              core.setOutput('tag', existing.name);
              return;
            }
            let latest = { major: 1, minor: 4, patch: 0 };
            for (const { name } of tags) {
              const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(name);
              if (!match) continue;
              const version = {
                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3])
              };
              if (version.major > latest.major ||
                  (version.major === latest.major && version.minor > latest.minor) ||
                  (version.major === latest.major && version.minor === latest.minor && version.patch > latest.patch)) {
                latest = version;
              }
            }
            const version = `${latest.major}.${latest.minor}.${latest.patch + 1}`;
            core.setOutput('version', version);
            core.setOutput('tag', `v${version}`);

      - name: Restore dependencies
        run: dotnet restore TabloidBrowser.Tests\TabloidBrowser.Tests.csproj

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $projects = @("TabloidBrowser.csproj", "TabloidBrowser.Tests\TabloidBrowser.Tests.csproj")
          $vulnerable = $false
          foreach ($project in $projects) {
            $output = dotnet list $project package --vulnerable --include-transitive | Out-String
            Write-Output "=== $project ==="
            Write-Output $output
            # Recent SDKs exit non-zero when vulnerable packages are found.
            if ($LASTEXITCODE -ne 0) { $vulnerable = $true }
            # Older SDKs only report via text; treat any output that does not
            # explicitly say "no vulnerable packages" as a finding, so a
            # wording change fails the build instead of silently passing.
            if ($output -notmatch "(?i)no vulnerable packages") { $vulnerable = $true }
          }
          if ($vulnerable) {
            Write-Error "Vulnerable NuGet packages detected - update before merging."
            exit 1
          }

      - name: Build
        run: dotnet build TabloidBrowser.Tests\TabloidBrowser.Tests.csproj --no-restore --configuration Release

      - name: Test
        timeout-minutes: 10
        run: dotnet test TabloidBrowser.Tests\TabloidBrowser.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Resolve release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Select-Xml -Path TabloidBrowser.csproj -XPath "//*[local-name()='Version']").Node.InnerText
          }
          "RELEASE_VERSION=$version" | Add-Content $env:GITHUB_ENV

      - name: Publish framework-dependent Windows app (online installer payload)
        shell: pwsh
        run: |
          dotnet publish TabloidBrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishReadyToRun=true `
            "-p:Version=$env:RELEASE_VERSION" `
            --output artifacts\Aerio-win-x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish self-contained Windows app (offline installer payload)
        shell: pwsh
        run: |
          dotnet publish TabloidBrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            "-p:Version=$env:RELEASE_VERSION" `
            --output artifacts\Aerio-win-x64-offline
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Windows app files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "Aerio.exe",
            "Assets\Aerio.ico"
          )
          foreach ($dir in @("artifacts\Aerio-win-x64", "artifacts\Aerio-win-x64-offline")) {
            foreach ($file in $requiredFiles) {
              $path = Join-Path $dir $file
              if (-not (Test-Path $path)) {
                Write-Error "Required Windows app file is missing: $path"
                exit 1
              }
            }
          }

      - name: Download offline WebView2 Runtime installer
        shell: pwsh
        run: |
          $runtimeInstaller = "artifacts\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124701" `
            -OutFile $runtimeInstaller
          $signature = Get-AuthenticodeSignature $runtimeInstaller
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            Write-Error "Downloaded WebView2 Runtime installer did not have a valid Microsoft signature."
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installers
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            Write-Error "Inno Setup compiler (ISCC.exe) was not found."
            exit 1
          }
          $outputDir = (Resolve-Path "artifacts").Path
          $onlineSource = (Resolve-Path "artifacts\Aerio-win-x64").Path
          $offlineSource = (Resolve-Path "artifacts\Aerio-win-x64-offline").Path
          $runtimeInstaller = (Resolve-Path "artifacts\MicrosoftEdgeWebView2RuntimeInstallerX64.exe").Path
          & $compiler "/DAppVersion=$env:RELEASE_VERSION" "/DAppSourceDir=$onlineSource" "/O$outputDir" installer\Aerio.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $compiler "/DAppVersion=$env:RELEASE_VERSION" "/DAppSourceDir=$offlineSource" "/DWebView2InstallerPath=$runtimeInstaller" "/DOfflineInstaller" "/O$outputDir" installer\Aerio.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          foreach ($installer in @(
              "artifacts\Aerio-Setup-win-x64.exe",
              "artifacts\Aerio-Setup-offline-win-x64.exe")) {
            if (-not (Test-Path $installer)) {
              Write-Error "Windows installer was not created: $installer"
              exit 1
            }
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts\Aerio-win-x64-offline\* `
            -DestinationPath artifacts\Aerio-win-x64.zip

      - name: Report artifact sizes
        shell: pwsh
        run: |
          function Get-SizeMB($path) {
            if (-not (Test-Path $path)) { return "missing" }
            $item = Get-Item $path
            if ($item.PSIsContainer) {
              return [math]::Round((Get-ChildItem -Recurse $item.FullName -File | Measure-Object Length -Sum).Sum / 1MB, 1)
            }
            return [math]::Round($item.Length / 1MB, 1)
          }
          $report = [ordered]@{
            "Framework-dependent publish (online payload)" = "$(Get-SizeMB 'artifacts\Aerio-win-x64') MB"
            "Self-contained publish (offline payload)" = "$(Get-SizeMB 'artifacts\Aerio-win-x64-offline') MB"
            "Online installer" = "$(Get-SizeMB 'artifacts\Aerio-Setup-win-x64.exe') MB"
            "Offline installer" = "$(Get-SizeMB 'artifacts\Aerio-Setup-offline-win-x64.exe') MB"
            "Portable ZIP" = "$(Get-SizeMB 'artifacts\Aerio-win-x64.zip') MB"
          }
          $table = @("| Artifact | Size |", "|---|---|")
          foreach ($key in $report.Keys) {
            $table += "| $key | $($report[$key]) |"
          }
          $table | ForEach-Object { Write-Host $_ }
          if ($env:GITHUB_STEP_SUMMARY) {
            $table | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Aerio-Windows-x64
          path: artifacts\Aerio-win-x64-offline\*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows online installer
        uses: actions/upload-artifact@v4
        with:
          name: Aerio-Installer-win-x64
          path: artifacts\Aerio-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows offline installer
        uses: actions/upload-artifact@v4
        with:
          name: Aerio-Installer-offline-win-x64
          path: artifacts\Aerio-Setup-offline-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub release assets
        uses: actions/upload-artifact@v4
        with:
          name: github-release-assets
          path: |
            artifacts\Aerio-Setup-win-x64.exe
            artifacts\Aerio-Setup-offline-win-x64.exe
            artifacts\Aerio-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          retention-days: 7

  publish-release:
    # Only main pushes publish. This job is the only one granted write access,
    # so PR and dev builds run entirely with read-only tokens.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: github-release-assets
          path: release-assets

      - name: Publish automatic GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-test.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Aerio v${{ needs.build-and-test.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Aerio-Setup-win-x64.exe
            release-assets/Aerio-Setup-offline-win-x64.exe
            release-assets/Aerio-win-x64.zip
