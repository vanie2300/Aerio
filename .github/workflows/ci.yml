name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore TabloidBrowser.Tests\TabloidBrowser.Tests.csproj

      - name: Build
        run: dotnet build TabloidBrowser.Tests\TabloidBrowser.Tests.csproj --no-restore --configuration Release

      - name: Test
        timeout-minutes: 10
        run: dotnet test TabloidBrowser.Tests\TabloidBrowser.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish self-contained Windows app
        run: dotnet publish TabloidBrowser.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts\Aerio-win-x64

      - name: Download offline WebView2 Runtime installer
        shell: pwsh
        run: |
          $runtimeInstaller = "artifacts\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124701" `
            -OutFile $runtimeInstaller
          $signature = Get-AuthenticodeSignature $runtimeInstaller
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            Write-Error "Downloaded WebView2 Runtime installer did not have a valid Microsoft signature."
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-Xml -Path TabloidBrowser.csproj -XPath "//*[local-name()='Version']").Node.InnerText
          $sourceDir = (Resolve-Path "artifacts\Aerio-win-x64").Path
          $runtimeInstaller = (Resolve-Path "artifacts\MicrosoftEdgeWebView2RuntimeInstallerX64.exe").Path
          $outputDir = (New-Item -ItemType Directory -Force "artifacts").FullName
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            Write-Error "Inno Setup compiler (ISCC.exe) was not found."
            exit 1
          }
          & $compiler "/DAppVersion=$version" "/DAppSourceDir=$sourceDir" "/DWebView2InstallerPath=$runtimeInstaller" "/O$outputDir" installer\Aerio.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "artifacts\Aerio-Setup-win-x64.exe")) {
            Write-Error "Windows installer was not created."
            exit 1
          }

      - name: Verify Windows app files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "artifacts\Aerio-win-x64\Aerio.exe",
            "artifacts\Aerio-win-x64\readability.min.js",
            "artifacts\Aerio-win-x64\Assets\the app icon.ico"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "Required Windows app file is missing: $file"
              exit 1
            }
          }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Aerio-Windows-x64
          path: artifacts\Aerio-win-x64\*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Aerio-Installer-win-x64
          path: artifacts\Aerio-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          retention-days: 7
