name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore test project
        run: dotnet restore TabloidBrowser.Tests\TabloidBrowser.Tests.csproj

      - name: Run tests
        run: dotnet test TabloidBrowser.Tests\TabloidBrowser.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish TabloidBrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            "-p:Version=$version" `
            --output release\Aerio-win-x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Windows app files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "release\Aerio-win-x64\Aerio.exe",
            "release\Aerio-win-x64\readability.min.js",
            "release\Aerio-win-x64\Assets\the app icon.ico"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "Required release file is missing: $file"
              exit 1
            }
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release\Aerio-win-x64\* `
            -DestinationPath Aerio-win-x64.zip

      - name: Download offline WebView2 Runtime installer
        shell: pwsh
        run: |
          $runtimeInstaller = "release\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124701" `
            -OutFile $runtimeInstaller
          $signature = Get-AuthenticodeSignature $runtimeInstaller
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            Write-Error "Downloaded WebView2 Runtime installer did not have a valid Microsoft signature."
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $sourceDir = (Resolve-Path "release\Aerio-win-x64").Path
          $runtimeInstaller = (Resolve-Path "release\MicrosoftEdgeWebView2RuntimeInstallerX64.exe").Path
          $outputDir = (Resolve-Path "release").Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            Write-Error "Inno Setup compiler (ISCC.exe) was not found."
            exit 1
          }
          & $compiler "/DAppVersion=$version" "/DAppSourceDir=$sourceDir" "/DWebView2InstallerPath=$runtimeInstaller" "/O$outputDir" installer\Aerio.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "release\Aerio-Setup-win-x64.exe")) {
            Write-Error "Windows installer was not created."
            exit 1
          }

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aerio-Windows-x64
          path: release\Aerio-win-x64\*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Aerio-win-x64.zip
            release/Aerio-Setup-win-x64.exe
