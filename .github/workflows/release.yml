name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore test project
        run: dotnet restore TabloidBrowser.Tests\TabloidBrowser.Tests.csproj

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $projects = @("TabloidBrowser.csproj", "TabloidBrowser.Tests\TabloidBrowser.Tests.csproj")
          $vulnerable = $false
          foreach ($project in $projects) {
            $output = dotnet list $project package --vulnerable --include-transitive | Out-String
            Write-Output "=== $project ==="
            Write-Output $output
            # Recent SDKs exit non-zero when vulnerable packages are found.
            if ($LASTEXITCODE -ne 0) { $vulnerable = $true }
            # Older SDKs only report via text; treat any output that does not
            # explicitly say "no vulnerable packages" as a finding, so a
            # wording change fails the build instead of silently passing.
            if ($output -notmatch "(?i)no vulnerable packages") { $vulnerable = $true }
          }
          if ($vulnerable) {
            Write-Error "Vulnerable NuGet packages detected - release blocked."
            exit 1
          }

      - name: Run tests
        run: dotnet test TabloidBrowser.Tests\TabloidBrowser.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "RELEASE_VERSION=$version" | Add-Content $env:GITHUB_ENV

      - name: Publish framework-dependent Windows app (online installer payload)
        shell: pwsh
        run: |
          dotnet publish TabloidBrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            "-p:Version=$env:RELEASE_VERSION" `
            --output release\Aerio-win-x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish self-contained Windows app (offline installer payload)
        shell: pwsh
        run: |
          dotnet publish TabloidBrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            "-p:Version=$env:RELEASE_VERSION" `
            --output release\Aerio-win-x64-offline
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Windows app files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "Aerio.exe",
            "Assets\Aerio.ico"
          )
          foreach ($dir in @("release\Aerio-win-x64", "release\Aerio-win-x64-offline")) {
            foreach ($file in $requiredFiles) {
              $path = Join-Path $dir $file
              if (-not (Test-Path $path)) {
                Write-Error "Required release file is missing: $path"
                exit 1
              }
            }
          }

      - name: Download offline WebView2 Runtime installer
        shell: pwsh
        run: |
          $runtimeInstaller = "release\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124701" `
            -OutFile $runtimeInstaller
          $signature = Get-AuthenticodeSignature $runtimeInstaller
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            Write-Error "Downloaded WebView2 Runtime installer did not have a valid Microsoft signature."
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installers
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            Write-Error "Inno Setup compiler (ISCC.exe) was not found."
            exit 1
          }
          $outputDir = (Resolve-Path "release").Path
          $onlineSource = (Resolve-Path "release\Aerio-win-x64").Path
          $offlineSource = (Resolve-Path "release\Aerio-win-x64-offline").Path
          $runtimeInstaller = (Resolve-Path "release\MicrosoftEdgeWebView2RuntimeInstallerX64.exe").Path
          & $compiler "/DAppVersion=$env:RELEASE_VERSION" "/DAppSourceDir=$onlineSource" "/O$outputDir" installer\Aerio.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $compiler "/DAppVersion=$env:RELEASE_VERSION" "/DAppSourceDir=$offlineSource" "/DWebView2InstallerPath=$runtimeInstaller" "/DOfflineInstaller" "/O$outputDir" installer\Aerio.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          foreach ($installer in @(
              "release\Aerio-Setup-win-x64.exe",
              "release\Aerio-Setup-offline-win-x64.exe")) {
            if (-not (Test-Path $installer)) {
              Write-Error "Windows installer was not created: $installer"
              exit 1
            }
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release\Aerio-win-x64-offline\* `
            -DestinationPath Aerio-win-x64.zip

      - name: Generate SHA256SUMS manifest
        shell: pwsh
        run: |
          $files = @(
            "release\Aerio-Setup-win-x64.exe",
            "release\Aerio-Setup-offline-win-x64.exe",
            "Aerio-win-x64.zip"
          )
          $lines = foreach ($file in $files) {
            if (Test-Path $file) {
              $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path $file -Leaf)"
            }
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Write-Host (Get-Content SHA256SUMS.txt | Out-String)

      - name: Report artifact sizes
        shell: pwsh
        run: |
          function Get-SizeMB($path) {
            if (-not (Test-Path $path)) { return "missing" }
            $item = Get-Item $path
            if ($item.PSIsContainer) {
              return [math]::Round((Get-ChildItem -Recurse $item.FullName -File | Measure-Object Length -Sum).Sum / 1MB, 1)
            }
            return [math]::Round($item.Length / 1MB, 1)
          }
          $report = [ordered]@{
            "Framework-dependent publish (online payload)" = "$(Get-SizeMB 'release\Aerio-win-x64') MB"
            "Self-contained publish (offline payload)" = "$(Get-SizeMB 'release\Aerio-win-x64-offline') MB"
            "Online installer" = "$(Get-SizeMB 'release\Aerio-Setup-win-x64.exe') MB"
            "Offline installer" = "$(Get-SizeMB 'release\Aerio-Setup-offline-win-x64.exe') MB"
            "Portable ZIP" = "$(Get-SizeMB 'Aerio-win-x64.zip') MB"
          }
          $table = @("| Artifact | Size |", "|---|---|")
          foreach ($key in $report.Keys) {
            $table += "| $key | $($report[$key]) |"
          }
          $table | ForEach-Object { Write-Host $_ }
          if ($env:GITHUB_STEP_SUMMARY) {
            $table | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aerio-Windows-x64
          path: release\Aerio-win-x64-offline\*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Aerio-Setup-win-x64.exe
            release/Aerio-Setup-offline-win-x64.exe
            Aerio-win-x64.zip
            SHA256SUMS.txt
